services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: cp476_afterhours
      MYSQL_USER: afterhours
      MYSQL_PASSWORD: afterhours_dev
    volumes:
      - ./backend/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/02_words.sql:/docker-entrypoint-initdb.d/02_words.sql\
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: afterhours
      MYSQL_PASSWORD: afterhours_dev
      MYSQL_DATABASE: cp476_afterhours
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend