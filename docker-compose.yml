services:
  db:
    image: mysql:8.4
    environment:
      FRONTEND_ORIGIN: "http://localhost:5173,https://afterhrs.party"
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: cp476_afterhours
      MYSQL_USER: afterhours
      MYSQL_PASSWORD: afterhours_dev
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/02_words.sql:/docker-entrypoint-initdb.d/02_words.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: afterhours
      MYSQL_PASSWORD: afterhours_dev
      MYSQL_DATABASE: cp476_afterhours
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data: